};
ACT['db-sec'] = t => { DBS.sec = t.dataset.v; paintDb(); };
INP['db-search'] = t => { DBS.q = t.value; $('#db-list').innerHTML = dbRows(); };
ACT['db-active'] = t => { const it = dbOf(DBS.sec, t.dataset.id); it.active = !it.active; paintDb(); normalize(); };
ACT['db-new'] = () => dbModal(null);
ACT['db-edit'] = t => dbModal(t.dataset.id);
function dbModal(id) {
  const sec = S.db[DBS.sec], it = id ? dbOf(DBS.sec, id) : { name: '', desc: '', active: true };
  openModal({
    title: id ? esc(it.name) : `Новая запись · ${esc(sec.title)}`,
    body: `<div><label class="lb">${sec.nameLabel}</label><input class="field" id="dbm-name" value="${esc(it.name)}" placeholder="Например: ${DBS.sec === 'scents' ? 'Сандал и мёд' : DBS.sec === 'themes' ? 'Рецепты уюта' : 'Название'}"></div>
    <div><div class="spread" style="margin-bottom:7px"><label class="lb" style="margin:0">${sec.descLabel}</label><button class="btn btn-g btn-sm" data-act="db-gen">${ic('wand')} Сгенерировать</button></div><textarea class="field" id="dbm-desc" data-inp="grow" style="min-height:130px">${esc(it.desc)}</textarea></div>
    <div class="tgl" data-act="sw-row"><span class="sw ${it.active ? 'on' : ''}" id="dbm-active"></span>Активна (доступна в формах создания)</div>`,
    foot: `${id ? `<button class="btn btn-d btn-sm" data-act="db-del" data-id="${id}">${ic('trash')} Удалить</button>` : '<span></span>'}<div class="gap8"><button class="btn btn-g btn-sm" data-act="db-copy">${ic('copy')} Копировать</button><button class="btn btn-sm" data-act="db-save" data-id="${id || ''}">Сохранить</button></div>`,
    onMount: w => autoGrow($('#dbm-desc', w))
  });
}
ACT['sw-row'] = t => t.querySelector('.sw').classList.toggle('on');
ACT['db-copy'] = () => copyText($('#dbm-name').value + '\n' + $('#dbm-desc').value);
ACT['db-gen'] = t => {
  const nm = $('#dbm-name').value.trim(); if (!nm) { toast('Сначала введите название', 'err'); return; }
  t.disabled = true; t.innerHTML = '<span class="spin" style="width:13px;height:13px"></span> Пишем…';
  setTimeout(() => {
    const map = {
      themes: `Подготовь материал на тему «${nm}». Начни с конкретной сцены, дальше 2 коротких абзаца, в конце мягкий призыв. Тон тёплый, без восклицаний. Упомяни соевый воск и хлопковый фитиль, если это уместно.`,
      scents: `Аромат «${nm}»: опиши верхние, средние и базовые ноты, настроение и комнату, где он уместен. Цвет воска и стиль этикетки подбери под характер аромата.`,
      formats: `Упаковка «${nm}»: опиши материал, цвет, текстуру и крышку. Для фото укажи, как лучше показать свет на поверхности.`,
      vstyles: `Стиль «${nm}»: опиши движение камеры, ритм монтажа, свет и звук. Одна непрерывная сцена без людей.`,
      cstyles: `Стиль «${nm}»: опиши сетку слайда, шрифты, количество текста и палитру. Единый вид для всех слайдов.`
    };
    const ta = $('#dbm-desc'); ta.value = map[DBS.sec]; autoGrow(ta);
    t.disabled = false; t.innerHTML = `${ic('wand')} Сгенерировать`; toast('Описание сгенерировано', 'ok');
  }, 1000);
};
ACT['db-save'] = t => {
  const name = $('#dbm-name').value.trim(); if (!name) { toast('Заполните название', 'err'); return; }
  const data = { name, desc: $('#dbm-desc').value.trim(), active: $('#dbm-active').classList.contains('on') };
  const sec = S.db[DBS.sec];
  if (t.dataset.id) Object.assign(dbOf(DBS.sec, t.dataset.id), data); else sec.items.unshift(Object.assign({ id: uid() }, data));
  toast(t.dataset.id ? 'Сохранено' : 'Добавлено', 'ok'); closeModal(t.closest('.modal-back')); paintDb();
};
ACT['db-del'] = async t => {
  const id = t.dataset.id, it = dbOf(DBS.sec, id), w = t.closest('.modal-back');
  if (!(await confirmBox(`Удалить «${it.name}»?`))) return;
  const sec = S.db[DBS.sec]; sec.items = sec.items.filter(i => i.id !== id); closeModal(w); normalize(); toast('Удалено', 'ok'); paintDb();
};

/* =====================================================================
   Ресерч и Идеи
   ===================================================================== */
const RS = { filter: 'new', agentsOpen: false };
const RS_AGENTS = [
  ['discovery-agent', 'Discovery: сбор новостей', 'Поиск свежих материалов по ключевым словам. Модель фиксирована: поисковая.', false],
  ['cleaning-agent', 'Очистка материалов', 'Чистит собранное от рекламы и повторов, приводит к структуре.', true],
  ['claim-factcheck-agent', 'Факт-чек', 'Извлекает утверждения и проверяет их по независимым источникам.', false],
  ['topic-builder-agent', 'Сборка тем', 'Синтезирует темы контента из проверенных фактов и оценивает их.', true],
  ['content-ideas-agent', 'Идеи контента', 'Предлагает идеи в разных форматах по каждой теме.', true]
];
function pipeHtml() {
  const r = S.research, running = r.status === 'running';
  return `<div class="pipe">${RS_STAGES.map(([l, ms], i) => {
    let c = '';
    if (r.status === 'done') c = 'done'; else if (running) c = i < r.stage ? 'done' : (i === r.stage ? 'cur' : '');
    return `<div class="${c}"><i><b style="--d:${ms}ms"></b></i>${l}</div>`;
  }).join('')}</div>`;
}
function rsLine() {
  const r = S.research;
  if (r.status === 'running') return `Стадия «${RS_STAGES[Math.min(r.stage, RS_STAGES.length - 1)][0]}» · ${Math.max(0, Math.floor((Date.now() - r.stageStart) / 1000))} сек`;
  if (r.status === 'done' && r.added) return `Последний запуск: ${fmtDate(r.last)}. Найдено ${r.added.t} ${plural(r.added.t, ['тема', 'темы', 'тем'])} и ${r.added.i} ${plural(r.added.i, ['идея', 'идеи', 'идей'])}.`;
  return `Последний запуск: ${fmtDate(r.last)}`;
}
function topicHtml(t) {
  return `<div class="rtopic"><h4>${esc(t.title)} ${t.fresh ? '<span class="tag ac">новое</span>' : ''}${t.fav ? `<span style="color:var(--ac)">${ic('star', 15, 'fill="currentColor"')}</span>` : ''}</h4>
    <p>${esc(t.sum)}</p>
    <div class="metrics">${metricBar('Важность', t.imp)}${metricBar('Тренд', t.trend)}${metricBar('Достоверность', t.conf)}</div>
    <div class="src">Источники: ${t.src.map(s => `<b>${esc(s)}</b>`).join(', ')}</div>
    <div class="gap8" style="margin-top:12px">
      <button class="btn btn-g btn-sm" data-act="t-fav" data-id="${t.id}">${ic('star')} ${t.fav ? 'В избранном' : 'В избранное'}</button>
      <button class="btn btn-g btn-sm" data-act="t-theme" data-id="${t.id}" ${t.added ? 'disabled' : ''}>${ic('plus')} ${t.added ? 'Тема добавлена' : 'Тема поста'}</button>
      <button class="btn btn-g btn-sm" data-act="t-arch" data-id="${t.id}">${ic('archive')} ${t.status === 'archived' ? 'Вернуть' : 'В архив'}</button>
      <button class="btn btn-g btn-sm" style="color:var(--err)" data-act="t-del" data-id="${t.id}">${ic('trash')}</button>
    </div></div>`;
}
function topicsList() {
  let items = S.topics;
  if (RS.filter === 'archive') items = items.filter(t => t.status === 'archived');
  else { items = items.filter(t => t.status !== 'archived'); if (RS.filter === 'new') items = items.filter(t => t.fresh); if (RS.filter === 'favorite') items = items.filter(t => t.fav); }
  items = items.slice().sort((a, b) => b.ts - a.ts);
  if (!items.length) return `<div class="empty"><b>Тем нет</b>${RS.filter === 'new' ? 'Новых тем пока нет. Запустите исследование выше.' : 'В этом разделе пока пусто.'}</div>`;
  return items.map(topicHtml).join('');
}
function kwHtml() {
  if (!S.kw.length) return `<div class="empty">Ключевых слов пока нет. Добавьте первое.</div>`;
  return S.kw.map(k => `<div class="kw-row"><span class="t ${k.on ? '' : 'mut2'}">${esc(k.kw)}</span><span class="sw ${k.on ? 'on' : ''}" data-act="kw-tog" data-id="${k.id}"></span><button class="icon-btn sm" data-act="kw-del" data-id="${k.id}" title="Удалить">${ic('trash')}</button></div>`).join('');
}
function paintResearch() {
  if (S.tab !== 'research') return;
  const r = S.research, run = r.status === 'running';
  const b = $('#rs-btn'); if (!b) return;
  b.disabled = run; b.innerHTML = run ? `<span class="spin" style="width:14px;height:14px;border-top-color:var(--ac-ink);border-color:rgba(0,0,0,.25)"></span> Исследование идёт…` : `${ic('bolt')} Запустить исследование`;
  $('#rs-pipe').innerHTML = pipeHtml(); $('#rs-line').textContent = rsLine();
  $('#rs-topics').innerHTML = topicsList(); paintRsSeg();
}
function paintRsSeg() {
  const n = k => k === 'new' ? S.topics.filter(t => t.fresh && t.status !== 'archived').length : k === 'all' ? S.topics.filter(t => t.status !== 'archived').length : k === 'favorite' ? S.topics.filter(t => t.fav && t.status !== 'archived').length : S.topics.filter(t => t.status === 'archived').length;
  $('#rs-seg').innerHTML = [['new', 'Новые'], ['all', 'Все'], ['favorite', 'Избранное'], ['archive', 'Архив']].map(([k, l]) => `<button class="${RS.filter === k ? 'on' : ''}" data-act="rs-filter" data-v="${k}">${l} <span class="mono" style="opacity:.6;font-size:11px;margin-left:3px">${n(k)}</span></button>`).join('');
}
VIEWS.research = page => {
  page.innerHTML = `${pageHead('Ресерч', 'Автоматическое исследование: ищет новости и тренды по ключевым словам, проверяет факты и собирает темы для контента.')}
  <div class="card"><div class="spread" style="flex-wrap:wrap"><div><div class="ct">Автоматическое исследование</div><div class="mut" style="font-size:12.5px">Обычно занимает 5–10 минут, в демо около 13 секунд. Стоимость запуска около $0.30.</div></div><button class="btn" id="rs-btn" data-act="rs-start"></button></div><div id="rs-pipe"></div><div class="mut mono" style="font-size:12px;margin-top:8px" id="rs-line"></div></div>
  <div class="card"><div class="spread" style="flex-wrap:wrap;margin-bottom:6px"><div class="ct" style="margin:0">Темы</div><div class="seg" id="rs-seg"></div></div><div id="rs-topics" style="margin-top:12px"></div></div>
  <div class="card"><div class="ct" style="margin-bottom:12px">Ключевые слова</div><div class="gap8" style="flex-wrap:nowrap;margin-bottom:12px"><input class="field" id="kw-in" placeholder="Новое ключевое слово" data-kw="1"><button class="btn" data-act="kw-add">Добавить</button></div><div id="kw-list">${kwHtml()}</div></div>
  <div class="card"><div class="spread" style="cursor:pointer" data-act="rs-agents"><div class="ct" style="margin:0">Настройки агентов</div><span style="color:var(--mut);transition:transform .15s;${RS.agentsOpen ? 'transform:rotate(180deg)' : ''}">${ic('chev', 18)}</span></div>
    <div ${RS.agentsOpen ? '' : 'hidden'} style="margin-top:10px">${RS_AGENTS.map(([k, t, d, m]) => `<div class="s-row"><div><div class="s-t">${t}</div><div class="s-d">${d}</div>${m && S.prompts[k].model && model(S.prompts[k].model) ? `<div style="margin-top:7px"><span class="tag">${esc(model(S.prompts[k].model).name)}</span></div>` : ''}</div><button class="icon-btn" data-act="prompt" data-key="${k}">${ic('gear')}</button></div>`).join('')}</div></div>`;
  paintResearch();
  viewTimer(() => { const l = $('#rs-line'); if (l && S.research.status === 'running') l.textContent = rsLine(); }, 1000);
};
on('research', paintResearch);
ACT['rs-start'] = () => { startResearch(); toast('Исследование запущено. В рабочей версии можно закрыть вкладку, прогресс сохранится на сервере.', 'ok'); };
ACT['rs-agents'] = () => { RS.agentsOpen = !RS.agentsOpen; const y = scrollY; go('research'); scrollTo(0, y); };
ACT['rs-filter'] = t => { RS.filter = t.dataset.v; $('#rs-topics').innerHTML = topicsList(); paintRsSeg(); };
const topicOf = id => S.topics.find(t => t.id === id);
ACT['t-fav'] = t => { const x = topicOf(t.dataset.id); x.fav = !x.fav; paintResearch(); };
ACT['t-arch'] = t => { const x = topicOf(t.dataset.id); x.status = x.status === 'archived' ? 'active' : 'archived'; toast(x.status === 'archived' ? 'Тема в архиве' : 'Тема возвращена', 'ok'); paintResearch(); };
ACT['t-del'] = async t => { const x = topicOf(t.dataset.id); if (!(await confirmBox(`Удалить тему «${x.title}»?`))) return; S.topics = S.topics.filter(y => y.id !== x.id); toast('Удалено', 'ok'); paintResearch(); };
ACT['t-theme'] = t => {
  const x = topicOf(t.dataset.id); x.added = true;
  S.db.themes.items.unshift({ id: uid(), name: ellipsis(x.title, 60), desc: x.sum, active: true });
  toast('Тема добавлена в генератор постов (раздел «База»)', 'ok'); paintResearch();
};
ACT['kw-add'] = () => { const i = $('#kw-in'), v = i.value.trim(); if (!v) return; S.kw.unshift({ id: uid(), kw: v, on: true }); i.value = ''; $('#kw-list').innerHTML = kwHtml(); };
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-kw]')) ACT['kw-add'](); });
ACT['kw-tog'] = t => { const k = S.kw.find(x => x.id === t.dataset.id); k.on = !k.on; $('#kw-list').innerHTML = kwHtml(); };
ACT['kw-del'] = async t => { const k = S.kw.find(x => x.id === t.dataset.id); if (!(await confirmBox(`Удалить ключевое слово «${k.kw}»?`))) return; S.kw = S.kw.filter(x => x !== k); $('#kw-list').innerHTML = kwHtml(); };

/* ---------- идеи ---------- */
const ID = { format: 'all', select: false, ids: new Set() };
function ideaHtml(i) {
  const tp = topicOf(i.topic);
  return `<div class="idea ${ID.select ? 'selectable' : ''} ${ID.ids.has(i.id) ? 'sel' : ''}" data-act="idea-row" data-id="${i.id}">
    <div class="spread"><span class="tag">${IDEA_FORMATS[i.format] || i.format}</span><span style="display:flex;gap:6px;align-items:center">${i.fresh ? '<span class="tag ac">новая</span>' : ''}</span></div>
    <h4>${esc(i.title)}</h4>${tp ? `<div class="aud" style="margin-top:-4px">Тема: ${esc(ellipsis(tp.title, 50))}</div>` : ''}
    <p>${esc(i.content)}</p>
    ${i.aud ? `<div class="aud">Аудитория: ${esc(i.aud)}</div>` : ''}
    <div class="acts"><span class="mut2" style="font-size:12px">Приоритет ${i.pri}/10</span><div class="gap8"><button class="icon-btn sm" data-act="idea-copy" data-id="${i.id}" title="Копировать">${ic('copy')}</button><button class="btn btn-sm" data-act="idea-use" data-id="${i.id}">${ic('create')} В работу</button></div></div></div>`;
}
function ideasList() {
  let items = S.ideas.slice();
  if (ID.format === 'new') items = items.filter(i => i.fresh); else if (ID.format !== 'all') items = items.filter(i => i.format === ID.format);
  items.sort((a, b) => b.pri - a.pri || b.ts - a.ts);
  if (!items.length) return `<div class="empty" style="grid-column:1/-1"><b>Идей нет</b>${ID.format === 'new' ? 'Последний прогон не добавил новых идей.' : 'Запустите исследование на вкладке «Ресерч».'}</div>`;
  return items.map(ideaHtml).join('');
}
function ideaChips() {
  const fm = ['all', 'new', ...Object.keys(IDEA_FORMATS)];
  const lab = k => k === 'all' ? 'Все' : k === 'new' ? 'Новые' : IDEA_FORMATS[k];
  const cnt = k => k === 'all' ? S.ideas.length : k === 'new' ? S.ideas.filter(i => i.fresh).length : S.ideas.filter(i => i.format === k).length;
  return fm.filter(k => k === 'all' || k === 'new' || cnt(k) > 0).map(k => `<button class="chip ${ID.format === k ? 'on' : ''}" data-act="idea-fmt" data-v="${k}">${lab(k)}<span class="n">${cnt(k)}</span></button>`).join('');
}
function ideasBar() {
  const b = $('#id-bar'); if (!b) return;
  b.hidden = !ID.select; $('#id-del').innerHTML = `${ic('trash')} Удалить (${ID.ids.size})`; $('#id-del').disabled = !ID.ids.size;
  $('#id-tog').textContent = ID.select ? 'Выход' : 'Выбрать';
}
VIEWS.ideas = page => {
  ID.select = false; ID.ids.clear();
  page.innerHTML = `${pageHead('Идеи', 'Готовые идеи контента из ресёрча. Нажмите «В работу», и форма создания заполнится сама.', `<button class="btn btn-g btn-sm" id="id-tog" data-act="idea-sel">Выбрать</button>`)}
  <div class="chips scroll" id="id-chips" style="margin-bottom:16px">${ideaChips()}</div>
  <div class="toolbar" id="id-bar" hidden><button class="btn btn-d btn-sm" id="id-del" data-act="idea-del" disabled></button><button class="btn btn-g btn-sm" data-act="idea-sel">Отмена</button></div>
  <div class="ideas" id="id-grid">${ideasList()}</div>`;
  ideasBar();
};
function paintIdeas() { $('#id-grid').innerHTML = ideasList(); $('#id-chips').innerHTML = ideaChips(); ideasBar(); }
ACT['idea-fmt'] = t => { ID.format = t.dataset.v; paintIdeas(); };
ACT['idea-sel'] = () => { ID.select = !ID.select; ID.ids.clear(); paintIdeas(); };
ACT['idea-row'] = t => { if (!ID.select) return; const id = t.dataset.id; ID.ids.has(id) ? ID.ids.delete(id) : ID.ids.add(id); t.classList.toggle('sel', ID.ids.has(id)); ideasBar(); };
ACT['idea-del'] = async () => {
  if (!ID.ids.size) return;
  if (!(await confirmBox(`Удалить ${ID.ids.size} ${plural(ID.ids.size, ['идею', 'идеи', 'идей'])}?`))) return;
  S.ideas = S.ideas.filter(i => !ID.ids.has(i.id)); toast(`Удалено: ${ID.ids.size}`, 'ok'); ID.ids.clear(); ID.select = false; paintIdeas();
};
ACT['idea-copy'] = (t, e) => { e.stopPropagation(); const i = S.ideas.find(x => x.id === t.dataset.id); copyText(i.title + '\n\n' + i.content, 'Идея скопирована'); };
ACT['idea-use'] = (t, e) => {
  e.stopPropagation(); if (ID.select) return;
  const i = S.ideas.find(x => x.id === t.dataset.id);
  const type = i.format === 'carousel' ? 'carousel' : (i.format === 'video' || i.format === 'reels_script') ? 'video' : 'text';
  const comment = type === 'video' ? `${i.title}. ${i.content}`.slice(0, 380) : `${i.title}. ${i.content}`.slice(0, 420);
  go('create', { prefill: { type, comment } });
  toast('Идея перенесена в форму создания', 'ok');
};

/* ===================== Старт ===================== */
(function init() {
  buildNav();
  normalize();
  go('home');
})();

</script>
</body>
</html>
